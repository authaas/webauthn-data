syntax = "proto3";

package webauthn.data.credential;

import "identity/principal.proto";
import "webauthn/authenticator/attestation/response.proto";
import "webauthn/credential/id.proto";
import "webauthn/data/login/state.proto";
import "webauthn/relying_party/id.proto";

// Record is a WebAuthn credential as registered: the identity it
// authenticates, the attestation it was registered with, the RP id it was
// issued under when the operator retains it, and its login state.
message Record {
  webauthn.credential.ID credential = 1;
  identity.Principal principal = 2;
  authenticator.attestation.Response attestation = 3;
  relying_party.ID rp_id = 4;
  login.State login = 5;
}
