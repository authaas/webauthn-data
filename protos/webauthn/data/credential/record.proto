syntax = "proto3";

package webauthn.data.credential;

import "identity/id.proto";
import "realm/id.proto";
import "webauthn/authenticator/attestation/response.proto";
import "webauthn/credential/id.proto";
import "webauthn/data/login/state.proto";
import "webauthn/relying_party/id.proto";

// Record is a WebAuthn credential as registered: the identity it
// authenticates, the realm and relying party it was registered under, the
// attestation it was registered with, and its login state.
message Record {
  .webauthn.credential.ID credential_id = 1;
  .identity.ID identity_id = 2;
  .realm.ID realm_id = 3;
  .webauthn.relying_party.ID rp_id = 4;
  .webauthn.authenticator.attestation.Response attestation = 5;
  login.State login = 6;
}
